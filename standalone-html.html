// BUG FIX: Lowered base score from 30→10 so that low-salt verdicts (tier 0) are reachable
function calcScore(text) {
  const t = text.toLowerCase();
  let score = 10;
  const len = text.length;
  score += Math.min(len / 8, 20);
  if (KEYWORDS.top.some(k => t.includes(k)))     score += 25;
  if (KEYWORDS.bottom.some(k => t.includes(k)))  score += 20;
  if (KEYWORDS.rug.some(k => t.includes(k)))     score += 35;
  if (KEYWORDS.airdrop.some(k => t.includes(k))) score += 15;
  const exclaims = (text.match(/[!?]/g) || []).length;
  score += Math.min(exclaims * 4, 16);
  const caps = (text.match(/[A-Z]/g) || []).length;
  score += Math.min(caps * 1.5, 12);
  return Math.min(Math.round(score + (Math.random() * 10 - 5)), 100);
}

// BUG FIX: Guaranteed to find a match because VERDICTS now cover full 0–100 range cleanly
function getVerdict(score) {
  const candidates = VERDICTS.filter(v => score >= v.score[0] && score <= v.score[1]);
  // Fallback: pick closest tier rather than fully random
  const pool = candidates.length
    ? candidates
    : VERDICTS.filter(v => Math.abs(v.score[0] - score) < 20);
  const safePool = pool.length ? pool : VERDICTS;
  return safePool[Math.floor(Math.random() * safePool.length)];
}

function getSaltColor(s) {
  if (s <= 25) return '#00ff88';
  if (s <= 50) return '#ffcc00';
  if (s <= 75) return '#ff6600';
  return '#ff2244';
}

function getSaltLabel(s) {
  if (s <= 20) return 'Barely Salty · เค็มน้อยมาก';
  if (s <= 40) return 'Getting Salty · เริ่มเค็มแล้วนะ';
  if (s <= 60) return 'Mid Degen Salt · เค็มระดับกลาง';
  if (s <= 80) return 'Mega Salty · เค็มหนักมาก';
  return 'MAXIMUM SALT 🧂 · เค็มถึงขีดสุด';
}

function animateScore(target) {
  const dur = 1600, start = Date.now();
  const fill = document.getElementById('gaugeFill');
  const num  = document.getElementById('scoreNum');
  const lbl  = document.getElementById('scoreLabel');
  const color = getSaltColor(target);

  // Make score visible before animation starts
  num.style.visibility = 'visible';

  const tick = () => {
    const p = Math.min((Date.now() - start) / dur, 1);
    const e = 1 - Math.pow(1 - p, 3);
    const cur = Math.round(target * e);
    const arc = (cur / 100) * 220;
    fill.setAttribute('stroke-dasharray', `${arc} 220`);
    num.textContent = cur + '%';
    num.style.color = color;
    num.style.filter = `drop-shadow(0 0 12px ${color})`;
    lbl.textContent = cur > 0 ? getSaltLabel(cur) : '';
    lbl.style.color = color;
    // animate bars
    for (let i = 0; i < 24; i++) {
      const b = document.getElementById('bar' + i);
      const h = Math.max(4, Math.sin(i * 0.7 + cur * 0.1) * 12 + (cur / 100) * 14 + 4);
      b.style.height = h + 'px';
      b.style.background = color;
      b.style.opacity = 0.6 + (i % 3) * 0.1;
    }
    if (p < 1) requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}

function analyze() {
  const g   = document.getElementById('grievance').value.trim();
  const err = document.getElementById('errorMsg');
  if (!g) {
    err.textContent = '⚠ Enter your rant, degen! / พิมพ์ความเค็มของนายก่อนเลย!';
    err.classList.remove('hidden');
    return;
  }
  err.classList.add('hidden');
  const score   = calcScore(g);
  const verdict = getVerdict(score);
  currentScore  = score;
  currentResult = { score, grievance: g, ...verdict };
  document.getElementById('resultQuote').textContent  = `"${g}"`;
  document.getElementById('judgeEN').textContent      = verdict.en;
  document.getElementById('judgeTH').textContent      = verdict.th;
  document.getElementById('adviceEN').textContent     = verdict.advEN;
  document.getElementById('adviceTH').textContent     = verdict.advTH;
  document.getElementById('inputSection').classList.add('hidden');
  document.getElementById('resultSection').classList.remove('hidden');
  animateScore(score);
}

// BUG FIX: Share text uses %0A for newlines which Twitter/X handles correctly
function shareX() {
  if (!currentResult) return;
  const salt  = '🧂'.repeat(Math.min(Math.ceil(currentScore / 25), 4));
  const label = getSaltLabel(currentScore).split('·')[0].trim();
  const text  = `${salt} My Crypto Salt Level: ${currentScore}% — "${label}"\n\nJust got roasted by The Ultimate Crypto Salt Meter 😂\n\n#CryptoSalt #Degen #Web3 #BTC`;
  window.open('https://twitter.com/intent/tweet?text=' + encodeURIComponent(text), '_blank');
}

// BUG FIX: Full reset now also restores scoreNum visibility and scoreLabel color
function reset() {
  document.getElementById('grievance').value = '';
  document.getElementById('inputSection').classList.remove('hidden');
  document.getElementById('resultSection').classList.add('hidden');

  const fill = document.getElementById('gaugeFill');
  fill.setAttribute('stroke-dasharray', '0 220');

  const num = document.getElementById('scoreNum');
  num.textContent       = '0%';
  num.style.color       = '#1e3a2f';
  num.style.filter      = 'none';
  num.style.visibility  = 'hidden';   // BUG FIX: hide "0%" on reset

  const lbl = document.getElementById('scoreLabel');
  lbl.textContent  = '';
  lbl.style.color  = '#1e3a2f';       // BUG FIX: reset label color too

  for (let i = 0; i < 24; i++) {
    const b = document.getElementById('bar' + i);
    b.style.height     = (4 + (i % 5) * 2) + 'px';
    b.style.background = '#1e3a2f';
    b.style.opacity    = '1';
  }
  currentScore = 0;
  currentResult = null;
}
