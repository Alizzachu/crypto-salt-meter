<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Ultimate Crypto Salt Meter 🧂</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #0a0e17;
      font-family: 'Courier New', monospace;
      padding: 24px;
      background-image: radial-gradient(ellipse at top, #0d1f2d 0%, #0a0e17 70%);
    }

    .grid-overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background-image:
        linear-gradient(rgba(0, 255, 136, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 255, 136, 0.03) 1px, transparent 1px);
      background-size: 40px 40px;
    }

    .container {
      max-width: 660px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }

    .header {
      text-align: center;
      margin-bottom: 28px;
    }

    .badge {
      font-size: 11px;
      color: #00ff88;
      letter-spacing: 4px;
      margin-bottom: 8px;
      opacity: 0.7;
    }

    .title1 {
      font-size: 28px;
      font-weight: 900;
      background: linear-gradient(90deg, #00ff88, #00ccff, #ff2244);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 1px;
      line-height: 1.2;
    }

    .title2 {
      font-size: 36px;
      font-weight: 900;
      background: linear-gradient(90deg, #ff2244, #ff6600, #ffcc00);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 2px;
      margin-top: 4px;
    }

    .subtitle {
      color: #4a5568;
      font-size: 12px;
      margin-top: 6px;
    }

    .card {
      background: linear-gradient(145deg, #0f1923, #111827);
      border: 1px solid #1e3a2f;
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 0 40px rgba(0, 255, 136, 0.05), inset 0 1px 0 rgba(255, 255, 255, 0.05);
    }

    .gauge-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 24px;
    }

    .gauge-svg-wrap {
      position: relative;
      width: 280px;
      height: 160px;
    }

    .gauge-svg-wrap svg {
      width: 100%;
      height: 100%;
    }

    .score-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      padding-bottom: 8px;
    }

    #scoreNum {
      font-size: 44px;
      font-weight: 900;
      line-height: 1;
      transition: color 0.3s;
    }

    #scoreLabel {
      font-size: 11px;
      opacity: 0.8;
      margin-top: 2px;
    }

    .bars {
      display: flex;
      gap: 3px;
      align-items: flex-end;
      height: 28px;
      margin-top: 8px;
    }

    .bar {
      width: 5px;
      border-radius: 2px;
      background: #1e3a2f;
      transition: all 0.5s;
    }

    .input-label {
      font-size: 12px;
      color: #00ff88;
      letter-spacing: 2px;
      margin-bottom: 8px;
    }

    textarea {
      width: 100%;
      background: #070d14;
      border: 1px solid #1e3a2f;
      border-radius: 8px;
      padding: 12px 14px;
      color: #e2e8f0;
      font-size: 13px;
      resize: none;
      outline: none;
      font-family: 'Courier New', monospace;
      transition: border-color 0.2s;
    }

    textarea:focus {
      border-color: #00ff88;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 12px 0 16px;
    }

    .tag {
      background: transparent;
      border: 1px solid #1e3a2f;
      border-radius: 20px;
      padding: 6px 14px;
      color: #94a3b8;
      font-size: 12px;
      cursor: pointer;
      font-family: 'Courier New', monospace;
      transition: all 0.2s;
    }

    .tag:hover {
      border-color: #00ff88;
      color: #00ff88;
      background: rgba(0, 255, 136, 0.05);
    }

    .error {
      color: #ff2244;
      font-size: 12px;
      margin-bottom: 12px;
    }

    .btn-analyze {
      width: 100%;
      padding: 14px;
      border-radius: 8px;
      border: none;
      background: linear-gradient(90deg, #00ff88, #00ccaa);
      color: #0a0e17;
      font-weight: 900;
      font-size: 15px;
      cursor: pointer;
      letter-spacing: 2px;
      font-family: 'Courier New', monospace;
      box-shadow: 0 0 20px rgba(0, 255, 136, 0.3);
      transition: opacity 0.2s;
    }

    .btn-analyze:hover {
      opacity: 0.85;
    }

    .result-quote {
      background: #070d14;
      border: 1px solid #1e3a2f;
      border-radius: 8px;
      padding: 16px 20px;
      margin-bottom: 20px;
      color: #64748b;
      font-size: 16px;
      font-style: italic;
      line-height: 1.5;
    }

    .verdict-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 16px;
    }

    .verdict-box {
      background: #070d14;
      border: 1px solid #1e3a2f;
      border-radius: 10px;
      padding: 20px;
    }

    .verdict-lang {
      font-size: 12px;
      letter-spacing: 2px;
      margin-bottom: 12px;
      font-weight: bold;
    }

    .verdict-text {
      color: #cbd5e1;
      font-size: 15px;
      margin-bottom: 16px;
      line-height: 1.7;
    }

    .advice-divider {
      border-top: 1px solid #1e3a2f;
      padding-top: 12px;
    }

    .advice-label {
      font-size: 12px;
      color: #ff6600;
      margin-bottom: 8px;
      font-weight: bold;
    }

    .advice-text {
      color: #94a3b8;
      font-size: 14px;
      line-height: 1.6;
    }

    .btn-share {
      width: 100%;
      padding: 13px;
      border-radius: 8px;
      border: none;
      background: linear-gradient(90deg, #1a1a2e, #16213e);
      outline: 1.5px solid #1d9bf0;
      color: #1d9bf0;
      font-weight: 800;
      font-size: 13px;
      cursor: pointer;
      letter-spacing: 1.5px;
      font-family: 'Courier New', monospace;
      margin-bottom: 10px;
      box-shadow: 0 0 12px rgba(29, 155, 240, 0.2);
      transition: all 0.2s;
    }

    .btn-share:hover {
      background: rgba(29, 155, 240, 0.12);
      box-shadow: 0 0 22px rgba(29, 155, 240, 0.35);
    }

    @keyframes intense-shake {
      0% {
        transform: translate(1px, 1px) rotate(0deg);
      }

      10% {
        transform: translate(-1px, -2px) rotate(-1deg);
      }

      20% {
        transform: translate(-3px, 0px) rotate(1deg);
      }

      30% {
        transform: translate(3px, 2px) rotate(0deg);
      }

      40% {
        transform: translate(1px, -1px) rotate(1deg);
      }

      50% {
        transform: translate(-1px, 2px) rotate(-1deg);
      }

      60% {
        transform: translate(-3px, 1px) rotate(0deg);
      }

      70% {
        transform: translate(3px, 1px) rotate(-1deg);
      }

      80% {
        transform: translate(-1px, -1px) rotate(1deg);
      }

      90% {
        transform: translate(1px, 2px) rotate(0deg);
      }

      100% {
        transform: translate(1px, -2px) rotate(-1deg);
      }
    }

    .shake-intense {
      animation: intense-shake 0.3s cubic-bezier(.36, .07, .19, .97) infinite;
    }

    .btn-reset {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      background: transparent;
      border: 1px solid #1e3a2f;
      color: #00ff88;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      letter-spacing: 2px;
      font-family: 'Courier New', monospace;
      transition: all 0.2s;
    }

    .btn-reset:hover {
      background: rgba(0, 255, 136, 0.05);
      border-color: #00ff88;
    }

    .ticker {
      margin-top: 16px;
      display: flex;
      gap: 20px;
      justify-content: center;
      font-size: 11px;
      letter-spacing: 1px;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>
  <div class="grid-overlay"></div>
  <div class="container">

    <div class="header">
      <div class="badge">◆ BLOCKCHAIN SENTIMENT ANALYSIS v2.0 ◆</div>
      <div class="title1">How Salty Are You Today,</div>
      <div class="title2">DEGEN? 🧂</div>
      <div class="subtitle">วันนี้นายเค็มแค่ไหน บอก Whale มาเลย</div>
    </div>

    <div class="card">
      <!-- Gauge -->
      <div class="gauge-wrap">
        <div class="gauge-svg-wrap">
          <svg viewBox="0 0 200 120">
            <defs>
              <linearGradient id="saltGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#00ff88" />
                <stop offset="40%" stop-color="#ffcc00" />
                <stop offset="70%" stop-color="#ff6600" />
                <stop offset="100%" stop-color="#ff2244" />
              </linearGradient>
              <filter id="glow">
                <feGaussianBlur stdDeviation="2" result="blur" />
                <feMerge>
                  <feMergeNode in="blur" />
                  <feMergeNode in="SourceGraphic" />
                </feMerge>
              </filter>
            </defs>
            <path d="M 25 95 A 70 70 0 0 1 175 95" fill="none" stroke="#1a2a20" stroke-width="14"
              stroke-linecap="round" />
            <path id="gaugeFill" d="M 25 95 A 70 70 0 0 1 175 95" fill="none" stroke="url(#saltGrad)" stroke-width="14"
              stroke-linecap="round" stroke-dasharray="0 220" filter="url(#glow)" />
          </svg>
          <div class="score-overlay">
            <div id="scoreNum" style="color:#1e3a2f; visibility:hidden;">0%</div>
            <div id="scoreLabel" style="color:#1e3a2f;"></div>
          </div>
        </div>
        <!-- BUG FIX: replaced document.write with proper DOM creation -->
        <div class="bars" id="bars"></div>
      </div>

      <!-- Input Section -->
      <div id="inputSection">
        <div class="input-label">> ENTER YOUR RANT / พิมพ์ความเค็มของนาย</div>
        <textarea id="grievance" rows="3"
          placeholder="I bought at ATH and it dumped 90%... / ซื้อตอน ATH แล้วร่วง 90% เอง..."></textarea>
        <div class="tags">
          <button class="tag" onclick="setTag('Bought the Top / ติดดอย')">📈 Bought the Top / ติดดอย</button>
          <button class="tag" onclick="setTag('Sold the Bottom / ขายหมู')">🐷 Sold the Bottom / ขายหมู</button>
          <button class="tag" onclick="setTag('Rugged / โดนรูด')">🪤 Rugged / โดนรูด</button>
          <button class="tag" onclick="setTag('Missed Airdrop / อดแอร์ดรอป')">💸 Missed Airdrop / อดแอร์ดรอป</button>
          <button class="tag" onclick="setTag('Liquidated / โดนล้างพอร์ต 💸')">💸 Liquidated / โดนล้างพอร์ต</button>
          <button class="tag" onclick="setTag('Gas > Profit / ค่าแก๊สแพงกว่ากำไร ⛽')">⛽ Gas > Profit /
            ค่าแก๊สแพง</button>
        </div>
        <div class="error hidden" id="errorMsg"></div>
        <button class="btn-analyze" onclick="analyze()">🧂 MEASURE MY SALT / วัดความเค็มฉันเลย</button>
      </div>

      <!-- Result Section -->
      <div id="resultSection" class="hidden">
        <div class="result-quote" id="resultQuote"></div>
        <div class="verdict-grid">
          <div class="verdict-box">
            <div class="verdict-lang" style="color:#00ff88">🇬🇧 WHALE SAYS</div>
            <div class="verdict-text" id="judgeEN"></div>
            <div class="advice-divider">
              <div class="advice-label">ADVICE</div>
              <div class="advice-text" id="adviceEN"></div>
            </div>
          </div>
          <div class="verdict-box">
            <div class="verdict-lang" style="color:#00ccff">🇹🇭 WHALE พูดว่า</div>
            <div class="verdict-text" id="judgeTH"></div>
            <div class="advice-divider">
              <div class="advice-label">คำแนะนำ</div>
              <div class="advice-text" id="adviceTH"></div>
            </div>
          </div>
        </div>
        <button class="btn-share" onclick="shareX()">𝕏 &nbsp;SHARE MY SALT TO X / แชร์ความเค็มลง X</button>
        <button class="btn-reset" onclick="reset()">🔄 NEW RANT / บ่นใหม่อีกรอบ</button>
      </div>
    </div>

    <div class="ticker">
      <span style="color:#00ff88">BTC ▲</span>
      <span style="color:#ff2244">YOUR PORTFOLIO ▼</span>
      <span style="color:#ffcc00">SALT LEVEL ▲▲▲</span>
    </div>
  </div>

  <script>
    // BUG FIX: replaced document.write() with proper DOM creation
    (function () {
      const barsEl = document.getElementById('bars');
      for (let i = 0; i < 24; i++) {
        const bar = document.createElement('div');
        bar.className = 'bar';
        bar.id = 'bar' + i;
        bar.style.height = (4 + (i % 5) * 2) + 'px';
        barsEl.appendChild(bar);
      }
    })();

    // BUG FIX: Redesigned VERDICTS with clean, non-overlapping tiers
    // Tier 0: 0–20  (barely salty)
    // Tier 1: 21–40 (getting salty)
    // Tier 2: 41–60 (mid degen)
    // Tier 3: 61–80 (mega salty)
    // Tier 4: 81–100 (maximum salt)
    const VERDICTS = [
      {
        score: [0, 20],
        en: "Too calm! Are you a human or an HFT bot? Such diamond hands belong in an exchange boardroom.",
        th: "นิ่งเกินไปแล้ว! นี่คนหรือบอท HFT? ใจเพชรขนาดนี้ไปเป็นเจ้าของ Exchange เองเถอะ",
        advEN: "Keep doing what you're doing. Pure Diamond.",
        advTH: "ทำดีแล้ว ทำต่อไป ใจเพชรที่แท้ทรู"
      },
      {
        score: [21, 50],
        en: "A pinch of salt. Feels like a failed gas fee. Go hug your Shih Tzu or play with your cat to calm down.",
        th: "เค็มนิด ๆ เหมือนเพิ่งเสียค่าแก๊สฟรีไปรอบนึง ไม่เป็นไรนะ ไปกอดหมา Shih Tzu หรือเล่นกับแมวให้ใจเย็นลงก่อน",
        advEN: "Take a deep breath and touch some grass.",
        advTH: "หายใจลึกๆ แล้วออกไปแตะหญ้าบ้างนะ"
      },
      {
        score: [51, 80],
        en: "You're hurting. Is the copium wearing off? Take a break and go find some Alpha in THE MUTUAL Discord instead.",
        th: "อาการหนักนะเราน่ะ กาวที่ดมเข้าไปเริ่มหมดฤทธิ์แล้วเหรอ? สภาพนี้พักเทรดแล้วไปหา Alpha ในกลุ่ม THE MUTUAL ก่อนไหม?",
        advEN: "Join THE MUTUAL and learn before you burn more capital.",
        advTH: "เข้ากลุ่ม THE MUTUAL ไปหาความรู้ก่อนจะเสียเงินไปมากกว่านี้"
      },
      {
        score: [81, 100],
        en: "Holy... You're a walking salt factory! Please quit trading. You're just exit liquidity. Go sell your brand-name denim; it's a better bet!",
        th: "โอ้โห... นี่มันโรงงานเกลือเคลื่อนที่! เลิกเทรดเถอะขอร้อง สภาพนี้คือ Exit Liquidity ชั้นดี ชวนคนอื่นไปช้อปปิ้งเสื้อผ้ามือสองที่ร้านคุณยังรุ่งกว่าเลย!",
        advEN: "Just stop. Seriously. The market thanks you for your liquidity.",
        advTH: "หยุดเถอะ พูดจริง ตลาดขอบคุณสำหรับสภาพคล่องนะ"
      }
    ];

    const KEYWORDS = {
      top: ['top', 'ath', 'high', 'peak', 'pump', 'ติดดอย', 'ดอย', 'สูงสุด', 'แพง'],
      bottom: ['bottom', 'low', 'dip', 'sold', 'dump', 'ขายหมู', 'หมู', 'ต่ำสุด', 'ขาย'],
      rug: ['rug', 'rugged', 'scam', 'hack', 'exploit', 'โดนรูด', 'รูด', 'โกง', 'หาย'],
      airdrop: ['airdrop', 'drop', 'claim', 'snapshot', 'อดแอร์ดรอป', 'แอร์ดรอป', 'พลาด'],
      liq: ['liquidated', 'liq', 'ล้างพอร์ต', 'แตก'],
      gas: ['gas', 'fee', 'ค่าแก๊ส', 'แก๊ส'],
    };

    let currentScore = 0;
    let currentResult = null;

    function setTag(text) { document.getElementById('grievance').value = text; }

    // BUG FIX: Lowered base score from 30→10 so that low-salt verdicts (tier 0) are reachable
    function calcScore(text) {
      const t = text.toLowerCase();
      let score = 10;
      const len = text.length;
      score += Math.min(len / 8, 20);
      if (KEYWORDS.top.some(k => t.includes(k))) score += 25;
      if (KEYWORDS.bottom.some(k => t.includes(k))) score += 20;
      if (KEYWORDS.rug.some(k => t.includes(k))) score += 35;
      if (KEYWORDS.airdrop.some(k => t.includes(k))) score += 15;
      if (KEYWORDS.liq.some(k => t.includes(k))) score += 40;
      if (KEYWORDS.gas.some(k => t.includes(k))) score += 15;
      const exclaims = (text.match(/[!?]/g) || []).length;
      score += Math.min(exclaims * 4, 16);
      const caps = (text.match(/[A-Z]/g) || []).length;
      score += Math.min(caps * 1.5, 12);
      return Math.min(Math.round(score + (Math.random() * 10 - 5)), 100);
    }

    // BUG FIX: Guaranteed to find a match because VERDICTS now cover full 0–100 range cleanly
    function getVerdict(score) {
      const candidates = VERDICTS.filter(v => score >= v.score[0] && score <= v.score[1]);
      // Fallback: pick closest tier rather than fully random
      const pool = candidates.length
        ? candidates
        : VERDICTS.filter(v => Math.abs(v.score[0] - score) < 20);
      const safePool = pool.length ? pool : VERDICTS;
      return safePool[Math.floor(Math.random() * safePool.length)];
    }

    function getSaltColor(s) {
      if (s <= 25) return '#00ff88';
      if (s <= 50) return '#ffcc00';
      if (s <= 75) return '#ff6600';
      return '#ff2244';
    }

    function getSaltLabel(s) {
      if (s <= 20) return 'Barely Salty · เค็มน้อยมาก';
      if (s <= 40) return 'Getting Salty · เริ่มเค็มแล้วนะ';
      if (s <= 60) return 'Mid Degen Salt · เค็มระดับกลาง';
      if (s <= 80) return 'Mega Salty · เค็มหนักมาก';
      return 'MAXIMUM SALT 🧂 · เค็มถึงขีดสุด';
    }

    function animateScore(target) {
      const dur = 1600, start = Date.now();
      const fill = document.getElementById('gaugeFill');
      const num = document.getElementById('scoreNum');
      const lbl = document.getElementById('scoreLabel');
      const color = getSaltColor(target);

      // Make score visible before animation starts
      num.style.visibility = 'visible';

      const tick = () => {
        const p = Math.min((Date.now() - start) / dur, 1);
        const e = 1 - Math.pow(1 - p, 3);
        const cur = Math.round(target * e);
        const arc = (cur / 100) * 220;
        fill.setAttribute('stroke-dasharray', `${arc} 220`);
        num.textContent = cur + '%';
        num.style.color = color;
        num.style.filter = `drop-shadow(0 0 12px ${color})`;
        lbl.textContent = cur > 0 ? getSaltLabel(cur) : '';
        lbl.style.color = color;
        // animate bars
        for (let i = 0; i < 24; i++) {
          const b = document.getElementById('bar' + i);
          const h = Math.max(4, Math.sin(i * 0.7 + cur * 0.1) * 12 + (cur / 100) * 14 + 4);
          b.style.height = h + 'px';
          b.style.background = color;
          b.style.opacity = 0.6 + (i % 3) * 0.1;
        }

        const wrap = document.querySelector('.gauge-svg-wrap');
        if (cur > 80) {
          wrap.classList.add('shake-intense');
        } else {
          wrap.classList.remove('shake-intense');
        }

        if (p < 1) requestAnimationFrame(tick);
      };
      requestAnimationFrame(tick);
    }

    function analyze() {
      const g = document.getElementById('grievance').value.trim();
      const err = document.getElementById('errorMsg');
      if (!g) {
        err.textContent = '⚠ Enter your rant, degen! / พิมพ์ความเค็มของนายก่อนเลย!';
        err.classList.remove('hidden');
        return;
      }
      err.classList.add('hidden');
      const score = calcScore(g);
      const verdict = getVerdict(score);
      currentScore = score;
      currentResult = { score, grievance: g, ...verdict };
      document.getElementById('resultQuote').textContent = `"${g}"`;
      document.getElementById('judgeEN').textContent = verdict.en;
      document.getElementById('judgeTH').textContent = verdict.th;
      document.getElementById('adviceEN').textContent = verdict.advEN;
      document.getElementById('adviceTH').textContent = verdict.advTH;
      document.getElementById('inputSection').classList.add('hidden');
      document.getElementById('resultSection').classList.remove('hidden');
      animateScore(score);
    }

    // BUG FIX: Share text uses %0A for newlines which Twitter/X handles correctly
    function shareX() {
      if (!currentResult) return;
      const salt = '🧂'.repeat(Math.min(Math.ceil(currentScore / 25), 4));
      const label = getSaltLabel(currentScore).split('·')[0].trim();
      const text = `${salt} My Crypto Salt Level: ${currentScore}% — "${label}"\n\nJust got roasted by The Ultimate Crypto Salt Meter 😂\n\n#CryptoSalt #Degen #Web3 #BTC`;
      window.open('https://twitter.com/intent/tweet?text=' + encodeURIComponent(text), '_blank');
    }

    // BUG FIX: Full reset now also restores scoreNum visibility and scoreLabel color
    function reset() {
      document.getElementById('grievance').value = '';
      document.getElementById('inputSection').classList.remove('hidden');
      document.getElementById('resultSection').classList.add('hidden');

      const fill = document.getElementById('gaugeFill');
      fill.setAttribute('stroke-dasharray', '0 220');

      const num = document.getElementById('scoreNum');
      num.textContent = '0%';
      num.style.color = '#1e3a2f';
      num.style.filter = 'none';
      num.style.visibility = 'hidden';   // BUG FIX: hide "0%" on reset

      const lbl = document.getElementById('scoreLabel');
      lbl.textContent = '';
      lbl.style.color = '#1e3a2f';       // BUG FIX: reset label color too

      document.querySelector('.gauge-svg-wrap').classList.remove('shake-intense');

      for (let i = 0; i < 24; i++) {
        const b = document.getElementById('bar' + i);
        b.style.height = (4 + (i % 5) * 2) + 'px';
        b.style.background = '#1e3a2f';
        b.style.opacity = '1';
      }
      currentScore = 0;
      currentResult = null;
    }
  </script>
</body>

</html>
